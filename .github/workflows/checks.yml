name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:reliability
      - run: npm run test:members
      - run: npm run test:care-db
      - run: npm run test:guest-db
      - run: npm run test:gateway
      - run: npm run test:gateway-db
      - run: npm run test:home-cell
      - run: npm run test:home-cell:accounts
      - run: npm run test:home-cell:onboarding
      - run: npm run build
      - run: node tests/auth-integration.mjs --gateway-only
      - run: npx playwright install --with-deps chromium
      - run: npm run test:home-cell:browser
      - run: npm audit --omit=dev --audit-level=high
